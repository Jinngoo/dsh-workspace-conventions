# The release gate: the same three commands a maintainer runs locally, run on
# every push and pull request so a regression cannot reach a published tarball.
#
# `pnpm build` runs before `pnpm test` on purpose: the tests import `src/*.ts`
# directly, but both `verify:*` scripts load `lib/`, and `lib/` is not committed.
name: verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
